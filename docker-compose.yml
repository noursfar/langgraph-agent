version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-agent-web
    ports:
      - "5000:5000"
    volumes:
      # Mount data directories to persist ChromaDB and documents
      - ./data:/app/data
      # Mount source code for development (optional, remove in production)
      - ./agent_core:/app/agent_core
      - ./api:/app/api
      - ./templates:/app/templates
      - ./static:/app/static
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    restart: unless-stopped
    networks:
      - llm-agent-network

networks:
  llm-agent-network:
    driver: bridge
